name = "high-signal-api"
main = "src/index.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["enable_ctx_exports"]
workers_dev = false
preview_urls = false

routes = [
  { pattern = "api.highsignal.app", custom_domain = true },
]

[ai]
binding = "AI"

# The public entrypoint is cached before Worker execution. The default gateway
# remains uncached so it can reject cookies, authorization, admin paths,
# mutations, health checks, and other private variants before cache lookup.
[cache]
enabled = false

[exports.PublicApi]
type = "worker"

[exports.PublicApi.cache]
enabled = true

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
ENVIRONMENT = "production"
TURNSTILE_HOSTNAMES = "highsignal.app,www.highsignal.app"

# Cron triggers — brief precompute runs every 30 min to keep snapshots fresh.
# The exact 00:17 trigger dispatches the canonical Reddit archive before ingest.
[triggers]
crons = ["*/30 * * * *", "17 0 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "high-signal-db"
database_id = "ebeab72b-61ab-4588-936c-1da6652a2ce4"
migrations_dir = "../../packages/db/migrations"
