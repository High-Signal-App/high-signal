name = "high-signal-web"
account_id = "7d048325699a5acddb44d3be31cf6ba9"
main = "worker.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
# Serve verified generated assets without invoking the Worker. Application
# routes remain Worker-first through the leading "/*" rule.
assets = { directory = ".open-next/assets", binding = "ASSETS", run_worker_first = [ "/*", "!/_next/static/*", "!/_astro/*", "!/docs", "!/docs/*", "!/.well-known/security.txt", "!/apple-touch-icon.png", "!/favicon-32.png", "!/favicon.ico", "!/favicon.svg", "!/icon.svg" ] }

# Custom domains — created/reconciled on deploy (idempotent if already added via dashboard).
# www is redirected to the apex by next.config.ts redirects().
routes = [
  { pattern = "highsignal.app", custom_domain = true },
  { pattern = "www.highsignal.app", custom_domain = true },
]

[observability]
enabled = true
head_sampling_rate = 0.1

[limits]
cpu_ms = 30000

[vars]
NODE_ENV = "production"
NEXT_PUBLIC_SAASMAKER_API_KEY = "pk_3eb4816ef2179c25f364315aa1c3148a88e8004bfa5e5235"
NEXT_PUBLIC_API_BASE = "https://api.highsignal.app"
APP_HEALTH_ENVIRONMENT = "production"
CF_ACCESS_AUD = "db098be998f8be05d9a950f8b2c29cc90f7d66343a3722cd0f5578cec0e15165"
CF_ACCESS_TEAM_DOMAIN = "long-frog-c8a6.cloudflareaccess.com"
# Everything readable is public. Cloudflare Access protects the operator paths,
# and the Worker verifies Access JWTs again before injecting ADMIN_TOKEN.
# The Access AUD and team domain are public identifiers tracked above.
# Infisical owns and syncs ADMIN_TOKEN and other secret values.
#   LAB_API_URL                 optional, points the /lab page at a Lab Postgres FastAPI
#   HIGH_SIGNAL_AI_API_KEY      optional, unlocks LLM calls in community digests
#   APP_HEALTH_INGEST_KEY       optional, sends history-unlock logs to App Health;
#                               the log client is a silent no-op until it is set

[[services]]
binding = "API"
service = "high-signal-api"
