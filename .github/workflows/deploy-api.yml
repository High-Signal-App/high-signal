name: Deploy API

on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy --tag ${{ github.sha }}
      - name: Smoke production API
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://api.highsignal.app/health >/dev/null
          curl --fail --silent --show-error --location --max-time 30 \
            "https://api.highsignal.app/data/daily?probe=$GITHUB_SHA" \
            | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  const payload = JSON.parse(raw);
                  if (!payload.date || !Array.isArray(payload.signals) || !Array.isArray(payload.evidenceEvents)) {
                    throw new Error("daily dump contract is incomplete");
                  }
                });
              '
          curl --fail --silent --show-error --location --max-time 30 \
            "https://api.highsignal.app/brief/daily?probe=$GITHUB_SHA" >/dev/null
