name: Deploy API

on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/api
          command: deploy --tag ${{ github.sha }}
      - name: Smoke production API
        run: |
          curl --fail --silent --show-error --location --max-time 30 \
            https://api.highsignal.app/health >/dev/null
          curl --fail --silent --show-error --location --max-time 30 \
            "https://api.highsignal.app/data/daily?probe=$GITHUB_SHA" \
            | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  const payload = JSON.parse(raw);
                  if (!payload.date || !Array.isArray(payload.signals) || !Array.isArray(payload.evidenceEvents)) {
                    throw new Error("daily dump contract is incomplete");
                  }
                });
              '
          curl --fail --silent --show-error --location --max-time 30 \
            "https://api.highsignal.app/brief/daily?probe=$GITHUB_SHA" >/dev/null
          curl --fail --silent --show-error --max-time 30 \
            --header "Accept: application/json, text/event-stream" \
            --header "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' \
            https://api.highsignal.app/mcp \
            | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  const dataLine = raw.split(/\r?\n/).find((line) => line.startsWith("data: "));
                  const payload = JSON.parse(dataLine ? dataLine.slice(6) : raw);
                  const names = (payload.result?.tools ?? []).map((tool) => tool.name);
                  const expected = ["get_daily_brief", "get_signal", "get_daily_dump", "get_source_coverage", "search_signals", "browse_source", "get_track_record", "get_entity"];
                  if (JSON.stringify(names) !== JSON.stringify(expected)) {
                    throw new Error(`MCP tool contract mismatch: ${JSON.stringify(names)}`);
                  }
                });
              '
          curl --fail --silent --show-error --max-time 30 \
            --header "Accept: application/json, text/event-stream" \
            --header "Content-Type: application/json" \
            --data '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_daily_brief","arguments":{"day":"today"}}}' \
            https://api.highsignal.app/mcp \
            | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  const dataLine = raw.split(/\r?\n/).find((line) => line.startsWith("data: "));
                  const payload = JSON.parse(dataLine ? dataLine.slice(6) : raw);
                  if (payload.result?.isError || !payload.result?.structuredContent?.data) {
                    throw new Error(`MCP today brief failed: ${raw}`);
                  }
                });
              '
