name: Temporary issue 218 cache lockfile generation

on:
  push:
    branches:
      - agent/highsignal-issue218-cachefix-20261005

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Verify candidate SHA and exact package-manager pin
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node -p 'require("./package.json").packageManager')" = "pnpm@10.33.2"
          test "$(pnpm --version)" = "10.33.2"
      - name: Generate lockfile from manifests and exact patch
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - uses: actions/upload-artifact@v7
        with:
          name: highsignal-issue218-lockfile-${{ github.sha }}
          path: pnpm-lock.yaml
          retention-days: 1
