name: Deploy web

on:
  workflow_dispatch:
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
        working-directory: apps/web
        env:
          SKIP_NEXT_APP_BUILD: "false"
      - run: pnpm exec opennextjs-cloudflare deploy --tag "$GITHUB_SHA"
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke production web
        run: |
          for path in / /signals /data /case-studies; do
            curl --fail --silent --show-error --location --max-time 30 \
              "https://highsignal.app${path}?probe=$GITHUB_SHA" >/dev/null
          done
          curl --fail --silent --show-error --location --max-time 30 \
            "https://highsignal.app/api/ai?probe=$GITHUB_SHA" \
            | node -e '
                let raw = "";
                process.stdin.on("data", (chunk) => { raw += chunk; });
                process.stdin.on("end", () => {
                  const payload = JSON.parse(raw);
                  const resources = payload.dataResources ?? [];
                  if (!resources.some((resource) => resource.id === "daily-dump-json")) {
                    throw new Error("agent catalog is missing the canonical daily dump");
                  }
                  const expectedTools = ["get_daily_brief", "get_signal", "get_daily_dump"];
                  if (payload.mcp?.url !== "https://api.highsignal.app/mcp" ||
                      JSON.stringify(payload.mcp?.tools) !== JSON.stringify(expectedTools)) {
                    throw new Error("agent catalog is missing the stable MCP contract");
                  }
                });
              '
          for path in /ideas /opportunities /teardowns /digest /agent-eval /domains /lab; do
            code="$(curl --silent --output /dev/null --write-out "%{http_code}" --max-time 30 \
              "https://highsignal.app${path}?probe=$GITHUB_SHA")"
            test "$code" = "404"
          done
