name: Temporary focused API qualification
on:
  push:
    branches: [agent/highsignal198-attention-queries-20261006]
permissions:
  contents: read
jobs:
  attention-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @high-signal/api test -- src/__tests__/events-rollup.test.ts
