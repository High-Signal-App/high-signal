name: cron-score

on:
  schedule:
    - cron: "30 22 * * *"  # daily 22:30 UTC, after US market close
  workflow_dispatch:

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: python/ingest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: uv sync
      - name: restore private canonical price history
        id: restore
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run python -m high_signal_ingest.stock_data_sync restore
      - name: report unavailable canonical history
        if: steps.restore.outcome != 'success'
        run: echo "::warning::Scoring skipped. Canonical history is unavailable; apply migration 0033 and qualify the bounded stock-data pilot before scoring. Existing outcomes are preserved."
      - name: score matured signals
        if: steps.restore.outcome == 'success'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE }}
        run: uv run python -m high_signal_ingest.score.runner
