name: Weekly Quality Check
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.1.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare pnpm
        if: hashFiles('pnpm-lock.yaml') != ''
        run: |
          corepack enable
          if node -e "const pm=require('./package.json').packageManager||''; process.exit(pm.startsWith('pnpm@')?0:1)"; then
            corepack install
          else
            corepack prepare pnpm@10.32.1 --activate
          fi

      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci --ignore-scripts
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --immutable
          else
            npm install --ignore-scripts
          fi

      - name: Run available quality scripts
        run: |
          run_script() {
            local script="$1"
            if node -e "const s=require('./package.json').scripts||{}; process.exit(s[process.argv[1]]?0:1)" "$script"; then
              if [ -f pnpm-lock.yaml ]; then
                pnpm run "$script"
              elif [ -f yarn.lock ]; then
                yarn "$script"
              else
                npm run "$script"
              fi
            else
              echo "No $script script"
            fi
          }

          run_script lint
          run_script typecheck
          run_script test
          run_script build

      - name: Diagnose API test failures
        if: failure()
        working-directory: workers/api
        shell: bash
        run: |
          set +e
          pnpm run test --reporter=json \
            --outputFile="$RUNNER_TEMP/api-test-results.json" \
            > "$RUNNER_TEMP/api-test-console.txt" 2>&1
          test_status=$?
          set -e
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const reportPath = path.join(process.env.RUNNER_TEMP, 'api-test-results.json');
          if (!fs.existsSync(reportPath)) {
            console.log('API tests ended without a JSON report.');
            console.log(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'api-test-console.txt'), 'utf8').slice(-6000));
          } else {
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            console.log(JSON.stringify({passed: report.numPassedTests, failed: report.numFailedTests}));
            for (const suite of report.testResults ?? []) {
              for (const test of suite.assertionResults ?? []) {
                if (test.status === 'failed') console.log(JSON.stringify({name: test.fullName, failures: test.failureMessages}));
              }
              if (suite.message) console.log(suite.message);
            }
          }
          NODE
          exit "$test_status"
