name: Publish reader

on:
  workflow_dispatch:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_run:
    workflows: [cron-publish, cron-ingest, cron-source-cadences]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: reader-publication
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Discover deployed reader source
        id: reader
        run: node apps/reader/scripts/discover-source.mjs
      # Render only code whose browser assets are already deployed.
      - uses: actions/checkout@v6
        if: steps.reader.outputs.ready == 'true'
        with:
          ref: ${{ steps.reader.outputs.source }}
      - uses: pnpm/action-setup@v6
        if: steps.reader.outputs.ready == 'true'
      - uses: actions/setup-node@v6
        if: steps.reader.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned reader dependencies
        if: steps.reader.outputs.ready == 'true'
        run: pnpm --filter @high-signal/reader... install --frozen-lockfile
      - name: Capture qualified public editions
        if: steps.reader.outputs.ready == 'true'
        run: pnpm --filter @high-signal/reader capture
      - name: Render brief artifacts
        if: steps.reader.outputs.ready == 'true'
        run: pnpm --filter @high-signal/reader build
        env:
          READER_BUILD_MODE: brief
      - name: Publish bounded artifacts and promote pointer
        if: steps.reader.outputs.ready == 'true'
        run: node apps/reader/scripts/publish-artifacts.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
