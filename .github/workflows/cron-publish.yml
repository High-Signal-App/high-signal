name: cron-publish

on:
  schedule:
    # 07:00 UTC daily — 1h after cron-ingest, 30 min before personal-brief.
    # Clears the draft queue without manual review (sarthak's directive).
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: dry-run (judge but don't PATCH)
        type: boolean
        default: false
      reapply:
        description: also re-judge already-published rows (one-time cleanup after rule change)
        type: boolean
        default: false

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: auto-publish drafts
        env:
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com/v1' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-chat' }}
        run: |
          if [ "${{ inputs.dry }}" = "true" ]; then
            pnpm signals:auto-publish:dry
          elif [ "${{ inputs.reapply }}" = "true" ]; then
            pnpm signals:auto-publish:reapply
          else
            pnpm signals:auto-publish:remote
          fi

  # The product's one daily output is a published brief. Assert a reader can
  # actually get one — the 2026-08-11..08-22 outage published nothing for twelve
  # days because no job checked. Runs even when auto-publish fails, since a
  # failed publish is exactly when the brief is most likely to be empty.
  verify-brief:
    needs: auto-publish
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: verify the public brief is publishing
        env:
          HIGH_SIGNAL_API: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
          BRIEF_REGIONS: global
        run: node scripts/verify-daily-brief.mjs
