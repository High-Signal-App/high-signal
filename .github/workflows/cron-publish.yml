name: cron-publish

on:
  # Scheduled by the API Worker's Cloudflare cron dispatcher at 03:30 UTC.
  workflow_dispatch:
    inputs:
      retry_slug:
        description: re-judge one previously killed signal through all existing evidence gates
        type: string
        default: ""
      inspect_slug:
        description: read-only retained-evidence counts for one signal; skips publishing
        type: string
        default: ""
      dry:
        description: dry-run (judge but don't PATCH)
        type: boolean
        default: false
      reapply:
        description: also re-judge already-published rows (one-time cleanup after rule change)
        type: boolean
        default: false
      retry_killed_today:
        description: re-judge only rows killed today in IST
        type: boolean
        default: false

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: auto-publish drafts
        env:
          RETRY_SLUG: ${{ inputs.retry_slug }}
          INSPECT_SLUG: ${{ inputs.inspect_slug }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com/v1' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-chat' }}
          AI_PROJECT_ID: high-signal
        run: |
          if [ -n "$INSPECT_SLUG" ]; then
            node scripts/inspect-signal-evidence.mjs
          elif [ -n "$RETRY_SLUG" ]; then
            retry_flags=(--remote --retry-killed "--slug=$RETRY_SLUG")
            if [ "${{ inputs.dry }}" = "true" ]; then
              retry_flags+=(--dry)
            fi
            pnpm exec tsx scripts/auto-publish-drafts.ts "${retry_flags[@]}"
          elif [ "${{ inputs.dry }}" = "true" ]; then
            pnpm signals:auto-publish:dry
          elif [ "${{ inputs.reapply }}" = "true" ]; then
            pnpm signals:auto-publish:reapply
          elif [ "${{ inputs.retry_killed_today }}" = "true" ]; then
            pnpm signals:auto-publish:retry-killed-today
          else
            pnpm signals:auto-publish:remote
          fi
      - name: rebuild current daily brief
        if: ${{ inputs.dry != true && !inputs.inspect_slug }}
        env:
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: node scripts/precompute-daily-brief.mjs
      - name: verify reader-facing brief and evidence freshness
        if: ${{ inputs.dry != true && !inputs.inspect_slug }}
        env:
          HIGH_SIGNAL_API: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
          BRIEF_REGIONS: global
        run: node scripts/verify-daily-brief.mjs
