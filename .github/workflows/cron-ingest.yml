name: cron-ingest

on:
  # Scheduled by the API Worker's Cloudflare cron dispatcher.
  workflow_dispatch:
    inputs:
      source:
        description: source filter (all, or any value accepted by high_signal_ingest.pipeline --source)
        type: string
        default: all
      days:
        description: lookback days
        type: string
        default: "1"
      feed_url:
        description: optional public website or feed URL to add before the news refresh
        type: string
        default: ""
      repair_event_ids:
        description: optional comma-separated public news event IDs (max 2); repair receipts instead of source ingestion
        type: string
        default: ""
      repair_preview_json:
        description: optional exact public receipt preview JSON (max 60000 bytes); requires repair_event_ids
        type: string
        default: ""
      repair_mode:
        description: receipt repair operation (standard replay is unchanged)
        type: choice
        options:
          - standard
          - metadata-only-apply
          - metadata-only-rollback
        default: standard
      repair_cftc_receipts:
        description: repair unchanged historical CFTC receipt associations instead of source ingestion
        type: boolean
        default: false
      fetch_only:
        description: retain source evidence without AI drafting
        type: boolean
        default: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: python/ingest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - run: uv sync
      - name: Validate exclusive receipt replay mode
        if: ${{ inputs.repair_cftc_receipts == true }}
        env:
          REPAIR_EVENT_IDS: ${{ inputs.repair_event_ids }}
          REPAIR_PREVIEW_JSON: ${{ inputs.repair_preview_json }}
          REPAIR_MODE: ${{ inputs.repair_mode || 'standard' }}
        run: |
          uv run python - <<'PYTHON'
          import os
          if (os.environ["REPAIR_EVENT_IDS"] or os.environ["REPAIR_PREVIEW_JSON"]
              or os.environ["REPAIR_MODE"] != "standard"):
              raise SystemExit("CFTC replay cannot be combined with news receipt replay")
          PYTHON
      - name: Validate optional prepared receipt input
        if: ${{ (inputs.repair_mode || 'standard') == 'standard' && inputs.repair_preview_json != '' }}
        env:
          REPAIR_PREVIEW_JSON: ${{ inputs.repair_preview_json }}
          REPAIR_EVENT_IDS: ${{ inputs.repair_event_ids }}
        run: |
          uv run python - <<'PYTHON'
          import os
          from pathlib import Path
          from high_signal_ingest.repair_news_receipts import event_ids, MAX_PREPARED_BYTES
          event_ids(os.environ["REPAIR_EVENT_IDS"])
          value = os.environ["REPAIR_PREVIEW_JSON"]
          if len(value.encode()) > MAX_PREPARED_BYTES:
              raise SystemExit("Prepared receipt input exceeds 60000 bytes")
          Path("receipt-repair-prepared.json").write_text(value)
          PYTHON
      - name: Validate saved metadata-only recovery preview
        if: ${{ (inputs.repair_mode || 'standard') != 'standard' }}
        env:
          REPAIR_MODE: ${{ inputs.repair_mode }}
          REPAIR_EVENT_IDS: ${{ inputs.repair_event_ids }}
          REPAIR_PREVIEW_JSON: ${{ inputs.repair_preview_json }}
        run: |
          uv run python - <<'PYTHON'
          import os
          from pathlib import Path
          from high_signal_ingest.repair_news_receipts import validate_metadata_dispatch_input
          validate_metadata_dispatch_input(
              os.environ["REPAIR_MODE"],
              os.environ["REPAIR_EVENT_IDS"],
              os.environ["REPAIR_PREVIEW_JSON"],
          )
          Path("receipt-repair-metadata-preview.json").write_text(
              os.environ["REPAIR_PREVIEW_JSON"]
          )
          PYTHON
      - name: Fetch canonical Reddit event export
        if: ${{ inputs.repair_cftc_receipts != true && inputs.repair_event_ids == '' && ((inputs.source || 'all') == 'all' || (inputs.source || 'all') == 'reddit') }}
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi
          mkdir -p artifacts/reddit-input
          latest="artifacts/reddit-input/latest.json"
          compressed="artifacts/reddit-input/events.jsonl.zst"
          events="artifacts/reddit-input/events.jsonl"
          npx --yes wrangler@4.120.0 r2 object get \
            "high-signal-reddit-archive/reddit/v2/latest.json" \
            --file "$latest" \
            --remote
          node scripts/reddit-archive-publication.mjs validate "$latest"
          object=$(node -p "JSON.parse(require('fs').readFileSync('$latest')).objects.events")
          expected_sha=$(node -p "JSON.parse(require('fs').readFileSync('$latest')).eventsSha256")
          npx --yes wrangler@4.120.0 r2 object get \
            "high-signal-reddit-archive/$object" \
            --file "$compressed" \
            --remote
          actual_sha=$(sha256sum "$compressed" | cut -d' ' -f1)
          test "$actual_sha" = "$expected_sha"
          zstd -q -d -f "$compressed" -o "$events"
          echo "REDDIT_ARCHIVE_EVENTS_PATH=$GITHUB_WORKSPACE/$events" >> "$GITHUB_ENV"
          echo "REDDIT_ARCHIVE_LATEST_PATH=$GITHUB_WORKSPACE/$latest" >> "$GITHUB_ENV"
      - name: source availability diagnostic
        if: ${{ inputs.repair_cftc_receipts != true && inputs.repair_event_ids == '' }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'high-signal sarthakagrawal927@gmail.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          PODCAST_INDEX_KEY: ${{ secrets.PODCAST_INDEX_KEY }}
          PODCAST_INDEX_SECRET: ${{ secrets.PODCAST_INDEX_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          # US government APIs (free registration)
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
          USDA_NASS_API_KEY: ${{ secrets.USDA_NASS_API_KEY }}
          # India government
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          # Crypto on-chain
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TOKEN_UNLOCKS_API_KEY: ${{ secrets.TOKEN_UNLOCKS_API_KEY }}
          # AI benchmarks
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Developer ecosystems
          LIBRARIES_IO_API_KEY: ${{ secrets.LIBRARIES_IO_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
        run: uv run python -m high_signal_ingest.source_diagnose --require-persistence --require-sec-identity
      - name: Add optional publication feed
        if: ${{ inputs.repair_cftc_receipts != true && inputs.repair_event_ids == '' && inputs.feed_url != '' }}
        env:
          FEED_URL: ${{ inputs.feed_url }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          uv run python - <<'PYTHON'
          import os
          import httpx
          response = httpx.post(
              f"{os.environ['API_BASE'].rstrip('/')}/admin/feed-sources",
              headers={"Authorization": f"Bearer {os.environ['ADMIN_TOKEN']}"},
              json={"url": os.environ["FEED_URL"]},
              timeout=30,
          )
          if response.status_code not in {200, 201}:
              raise SystemExit(f"Feed registration failed: HTTP {response.status_code}")
          source = response.json()["source"]
          print(f"Publication feed ready: {source['id']}")
          PYTHON
      - name: Repair selected retained article receipts
        if: ${{ inputs.repair_event_ids != '' }}
        env:
          REPAIR_EVENT_IDS: ${{ inputs.repair_event_ids }}
          REPAIR_MODE: ${{ inputs.repair_mode || 'standard' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          if [ "$REPAIR_MODE" = "standard" ]; then
            args=()
            if [ -f receipt-repair-prepared.json ]; then
              args+=(--prepared-file receipt-repair-prepared.json)
            fi
            uv run python -m high_signal_ingest.repair_news_receipts \
              --event-ids "$REPAIR_EVENT_IDS" \
              --preview-file receipt-repair-preview.json "${args[@]}" --apply
          else
            action=--apply
            if [ "$REPAIR_MODE" = "metadata-only-rollback" ]; then
              action=--rollback
            elif [ "$REPAIR_MODE" != "metadata-only-apply" ]; then
              echo "Unsupported repair mode" >&2
              exit 2
            fi
            uv run python -m high_signal_ingest.repair_news_receipts \
              --event-ids "$REPAIR_EVENT_IDS" \
              --preview-file receipt-repair-metadata-preview.json \
              --metadata-only-recovery "$action"
          fi
      - name: Preserve exact receipt replay preview
        if: ${{ always() && inputs.repair_event_ids != '' && (inputs.repair_mode || 'standard') == 'standard' }}
        uses: actions/upload-artifact@v7
        with:
          name: receipt-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: python/ingest/receipt-repair-preview.json
          if-no-files-found: warn
          retention-days: 14
      - name: Repair unchanged historical CFTC receipts
        if: ${{ inputs.repair_cftc_receipts == true }}
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE }}
        run: |
          uv run python -m high_signal_ingest.repair_cftc_receipts \
            --max-rows 10000 --preview-file cftc-receipt-repair-preview.json --apply
      - name: Preserve exact CFTC receipt replay preview
        if: ${{ always() && inputs.repair_cftc_receipts == true }}
        uses: actions/upload-artifact@v7
        with:
          name: cftc-receipt-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: python/ingest/cftc-receipt-repair-preview.json
          if-no-files-found: warn
          retention-days: 14
      - name: ingest
        if: ${{ inputs.repair_cftc_receipts != true && inputs.repair_event_ids == '' }}
        env:
          FETCH_ONLY: ${{ inputs.fetch_only && 'true' || 'false' }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-v4-flash' }}
          AI_PROJECT_ID: high-signal
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'high-signal sarthakagrawal927@gmail.com' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
          REGULATIONS_GOV_API_KEY: ${{ secrets.REGULATIONS_GOV_API_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          PODCAST_INDEX_KEY: ${{ secrets.PODCAST_INDEX_KEY }}
          PODCAST_INDEX_SECRET: ${{ secrets.PODCAST_INDEX_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          # US government APIs (free registration)
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
          LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
          FDA_API_KEY: ${{ secrets.FDA_API_KEY }}
          USDA_NASS_API_KEY: ${{ secrets.USDA_NASS_API_KEY }}
          # India government
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
          # Crypto on-chain
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TOKEN_UNLOCKS_API_KEY: ${{ secrets.TOKEN_UNLOCKS_API_KEY }}
          # AI benchmarks
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Developer ecosystems
          LIBRARIES_IO_API_KEY: ${{ secrets.LIBRARIES_IO_API_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          # Batch generation tuning
          EDGAR_TICKER_LIMIT: "25"
          SIGNAL_CLUSTER_LIMIT: "40"
          SMALL_CLUSTER_THRESHOLD: "4"
        run: |
          args=()
          if [ "$FETCH_ONLY" = "true" ]; then
            args+=(--fetch-only)
          fi
          uv run python -m high_signal_ingest.pipeline \
            --source "${{ inputs.source || 'all' }}" \
            --days "${{ inputs.days || '1' }}" "${args[@]}"

      - name: Preserve undelivered signal candidates
        if: always() && hashFiles('python/ingest/signal-recovery/*.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: signal-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: python/ingest/signal-recovery/*.md
          if-no-files-found: error
          retention-days: 14
