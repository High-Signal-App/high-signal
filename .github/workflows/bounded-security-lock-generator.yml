name: Temporary High Signal security lock generator
on:
  push:
    branches: [agent/highsignal223-next-security-lock-20261008]
permissions:
  contents: read
jobs:
  generate-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pnpm outdated --recursive --format json
        continue-on-error: true
      - run: pnpm install --lockfile-only --ignore-scripts
      - uses: actions/upload-artifact@v7
        with:
          name: highsignal223-lock-${{ github.sha }}
          path: pnpm-lock.yaml
          retention-days: 1
          if-no-files-found: error
