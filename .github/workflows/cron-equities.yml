name: cron-equities

# Daily after US close: this is the only scheduled public stock-price ingress.
# Pull universe + closes via yfinance, compute the Tier 1 snapshot, regenerate
# derived bundles, and commit the artifacts.
# Dispatch deploy-web.yml when the accumulated web changes are ready to ship.

on:
  schedule:
    - cron: "30 21 * * 1-5"  # 9:30pm UTC weekdays = ~16:30 ET, post-close
  workflow_dispatch:
    inputs:
      limit:
        description: "Only process the first N tickers (smoke test). Empty = full run."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: canonical-stock-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  equities:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python: build universe + snapshot JSONL ─────────────────────────
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: uv sync
        working-directory: python/ingest
        run: uv sync
      - name: restore private canonical stock history
        working-directory: python/ingest
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run python -m high_signal_ingest.stock_data_sync restore
      - name: equities daily snapshot
        working-directory: python/ingest
        env:
          LIMIT_FLAG: ${{ github.event.inputs.limit && format('--limit {0}', github.event.inputs.limit) || '' }}
        run: |
          uv run python -m high_signal_ingest.equities_daily --batch 50 $LIMIT_FLAG
      # ── Node: regenerate the web data bundles that depend on JSONL ──────
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        # Reads version from package.json `packageManager` field — keep this
        # action invocation minimal so the two never drift.
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: build equities-snapshot.json
        run: pnpm equities:snapshot
      - name: build price-context.json
        run: pnpm price:snapshot
      - name: refresh market context from the canonical equities snapshot
        run: pnpm market:refresh
      - name: build market-refreshes.json
        run: pnpm market:snapshot
      - name: bundle known-tickers.json for Worker
        run: pnpm tickers:bundle

      - name: refresh retained financial facts through the shared collector
        working-directory: python/ingest
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run python -m high_signal_ingest.pipeline --source sec-xbrl --days 120 --fetch-only
      - name: refresh attributed free reference FX
        working-directory: python/ingest
        run: uv run python -m high_signal_ingest.stock_data_collectors.ecb
      - name: materialize display and permitted-export contracts
        run: uv run --project python/ingest python -m high_signal_ingest.stock_data_refresh --out packages/shared/src/stock-data/snapshot.json
      # ── Commit + push for the next manual web deploy ────────────────────
      - name: commit refreshed artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/data/equities-snapshot.json \
                  apps/web/src/data/price-context.json \
                  data/personal-market-refresh.jsonl \
                  apps/web/src/data/market-refreshes.json \
                  workers/api/src/lib/known-tickers.json
          git add packages/shared/src/stock-data/snapshot.json packages/shared/src/stock-data/price-status.json
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(equities): refresh daily snapshot"
            # Rebase on any concurrent push (other crons / human) so the
            # data-commit applies cleanly instead of a non-fast-forward reject.
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            # --no-verify: bot data-commits must not run the husky pre-push
            # code-lint hook (biome check). Lint is gated by CI, not by data crons.
            git push --no-verify
          fi

      - name: retain private inputs and publish permitted snapshots
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run --project python/ingest python -m high_signal_ingest.stock_data_sync publish --snapshot packages/shared/src/stock-data/snapshot.json
      - name: consume validated stock facts in High Signal research
        working-directory: python/ingest
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run python -m high_signal_ingest.pipeline --source stock-data --days 550 --strict
