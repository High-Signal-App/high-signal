name: cron-equities

# Canonical ingress: official full NSE cash-market files plus non-NSE yfinance.
# NSE originals and normalized history stay in private R2, never Git.
# Dispatch deploy-web.yml when the accumulated web changes are ready to ship.

on:
  schedule:
    - cron: "30 13 * * *"  # 19:00 India: NSE final files
    - cron: "30 21 * * 1-5"  # 9:30pm UTC weekdays = ~16:30 ET, post-close
  workflow_dispatch:
    inputs:
      limit:
        description: "Only process the first N tickers (smoke test). Empty = full run."
        required: false
        default: ""

      market:
        description: "Market to refresh. NSE always uses the entire cash-market dump."
        type: choice
        options: [both, nse, global]
        default: both
      session:
        description: "Optional NSE session YYYY-MM-DD (defaults to latest expected closed session)."
        required: false
        default: ""
      retain_global_history:
        description: "Retain bounded non-NSE history in the existing D1 ledger (requires migrated API)."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: canonical-stock-data
  cancel-in-progress: false

jobs:
  nse:
    if: github.event_name == 'schedule' || inputs.market != 'global'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Download and validate entire NSE security master and final bhavcopy
        env:
          NSE_SESSION: ${{ inputs.session }}
        run: |
          args=()
          # UTC date identifies the session even at the 21:30 UTC retry,
          # which is already the following date in India. Probe weekends too:
          # NSE may hold special sessions; absent files never imply a holiday.
          args=(--session "${NSE_SESSION:-$(date -u +%F)}")
          uv run --project python/ingest python -m high_signal_ingest.equities_daily \
            --market nse --archive artifacts/nse "${args[@]}"
      - name: Retain full history and advance latest only after verified R2 receipts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          uv run --project python/ingest python -m high_signal_ingest.nse_archive publish \
            --root artifacts/nse --out data/stock-data-nse-prices.json
      - name: Validate the canonical NSE dataset for existing input consumers
        run: uv run --project python/ingest python -m high_signal_ingest.nse_archive consume --root artifacts/nse --allow-stale
      - name: Report archive status
        if: always()
        run: |
          if [[ "${{ job.status }}" != success ]]; then
            echo "NSE refresh or downstream consumption failed. Inspect the failing step; no missing session is labelled current." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Full NSE CM files retained privately and the canonical dataset verified." >> "$GITHUB_STEP_SUMMARY"
          fi

  equities:
    needs: nse
    if: always() && ((github.event_name == 'schedule' && github.event.schedule == '30 21 * * 1-5') || (github.event_name == 'workflow_dispatch' && inputs.market != 'nse'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Python: build universe + snapshot JSONL ─────────────────────────
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: uv sync
        working-directory: python/ingest
        run: uv sync
      - name: restore private canonical stock history
        if: github.event_name == 'workflow_dispatch' && inputs.retain_global_history
        working-directory: python/ingest
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run python -m high_signal_ingest.stock_data_sync restore --snapshot ../../data/stock-data/publications.json
      - uses: actions/setup-node@v6
        with: { node-version: "22" }
      - name: Restore canonical NSE inputs into the shared price projection
        id: nse_inputs
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          uv run --project python/ingest python -m high_signal_ingest.nse_archive restore \
            --root data/stock-data/nse --out data/stock-data-nse-prices.json --optional --allow-stale
      - name: Report unavailable NSE inputs without stopping other markets
        if: steps.nse_inputs.outcome == 'failure'
        run: |
          echo "::warning::NSE archive unavailable. Global projection marks NSE missing and preserves previous ticker identities."
          echo "NSE archive unavailable; non-NSE collection continues with explicit partial coverage." >> "$GITHUB_STEP_SUMMARY"
      - name: equities daily snapshot
        working-directory: python/ingest
        env:
          PILOT: ${{ github.event_name == 'workflow_dispatch' && inputs.retain_global_history && 'true' || 'false' }}
          TICKER_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          if [ "$PILOT" = true ]; then
            uv run python -m high_signal_ingest.equities_daily --batch 50 --limit "${TICKER_LIMIT:-20}" --period 1mo --retain-history
          elif [ -n "$TICKER_LIMIT" ]; then
            uv run python -m high_signal_ingest.equities_daily --batch 50 --limit "$TICKER_LIMIT"
          else
            uv run python -m high_signal_ingest.equities_daily --batch 50
          fi
      # ── Node: regenerate the web data bundles that depend on JSONL ──────
      - uses: actions/setup-node@v6
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v6
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        # Reads version from package.json `packageManager` field — keep this
        # action invocation minimal so the two never drift.
      - name: pnpm install
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        run: pnpm install --frozen-lockfile
      - name: build equities-snapshot.json
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        run: pnpm equities:snapshot
      - name: build price-context.json
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        run: pnpm price:snapshot
      - name: refresh market context from the canonical equities snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        run: pnpm market:refresh
      - name: build market-refreshes.json
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        run: pnpm market:snapshot
      - name: bundle known-tickers.json for Worker
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        run: pnpm tickers:bundle

      # ── Commit + push for the next manual web deploy ────────────────────
      - name: commit refreshed artifacts
        if: github.event_name != 'workflow_dispatch' || inputs.retain_global_history != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/data/equities-snapshot.json \
                  apps/web/src/data/price-context.json \
                  data/personal-market-refresh.jsonl \
                  apps/web/src/data/market-refreshes.json \
                  workers/api/src/lib/known-tickers.json
          git add packages/shared/src/stock-data/price-status.json
          if git diff --staged --quiet; then
            echo "no changes to commit"
          else
            git commit -m "chore(equities): refresh daily snapshot"
            # Rebase on any concurrent push (other crons / human) so the
            # data-commit applies cleanly instead of a non-fast-forward reject.
            git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
            # --no-verify: bot data-commits must not run the husky pre-push
            # code-lint hook (biome check). Lint is gated by CI, not by data crons.
            git push --no-verify
          fi

      - name: refresh retained financial facts through the shared collector
        if: github.event_name == 'workflow_dispatch' && inputs.retain_global_history
        working-directory: python/ingest
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run python -m high_signal_ingest.pipeline --source sec-xbrl --days 120 --fetch-only
      - name: refresh attributed free reference FX
        if: github.event_name == 'workflow_dispatch' && inputs.retain_global_history
        working-directory: python/ingest
        run: uv run python -m high_signal_ingest.stock_data_collectors.ecb
      - name: materialize display and permitted-export contracts
        if: github.event_name == 'workflow_dispatch' && inputs.retain_global_history
        run: uv run --project python/ingest python -m high_signal_ingest.stock_data_refresh --out data/stock-data/publications.json
      - name: retain private inputs and publish permitted snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.retain_global_history
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run --project python/ingest python -m high_signal_ingest.stock_data_sync publish --snapshot data/stock-data/publications.json
      - name: consume validated stock facts in High Signal research
        if: github.event_name == 'workflow_dispatch' && inputs.retain_global_history
        working-directory: python/ingest
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          API_BASE: ${{ secrets.API_BASE || 'https://api.highsignal.app' }}
        run: uv run python -m high_signal_ingest.pipeline --source stock-data --days 550 --strict
