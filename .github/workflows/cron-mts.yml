name: cron-mts

on:
  # Scheduled by the API Worker's Cloudflare cron dispatcher.
  workflow_dispatch:

concurrency:
  group: cron-mts
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: python/ingest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: uv sync
      - name: collect MTS attention and verify threshold discoveries
        env:
          API_BASE: ${{ secrets.API_BASE }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL || 'https://api.deepseek.com' }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'deepseek-v4-flash' }}
          AI_PROJECT_ID: high-signal
        run: uv run python -m high_signal_ingest.mts
