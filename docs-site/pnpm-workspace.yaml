# docs-site is deliberately its own pnpm root, outside the high-signal workspace:
# it only depends on `blume` and shares nothing with apps/, packages/, or workers/.
# An empty `packages` list stops pnpm walking up to ../pnpm-workspace.yaml.
packages: []

# blume emits .blume/astro.config.mjs, which imports `astro/config` directly even
# though `astro` is only a transitive dependency of blume. npm's flat node_modules
# hoisted it; pnpm's default isolated layout does not. The hoisted linker restores
# that resolution while still hardlinking every file from the shared pnpm store.
nodeLinker: hoisted

onlyBuiltDependencies:
  - esbuild
  - sharp
